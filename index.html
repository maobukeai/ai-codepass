<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI CodePass</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000000;
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
      }

      @media (prefers-color-scheme: light) {
        html,
        body {
          background: #f5f5f7;
          color: #1d1d1f;
        }
      }

      #app-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: inherit;
        color: inherit;
        transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      #app-boot-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .app-boot-logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        box-shadow: 0 8px 32px rgba(0, 113, 227, 0.28);
        animation: app-boot-pulse 2s ease-in-out infinite;
      }

      .app-boot-mark {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.015em;
        background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.75) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      @media (prefers-color-scheme: light) {
        .app-boot-mark {
          background: linear-gradient(180deg, #1d1d1f 0%, rgba(29, 29, 31, 0.75) 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
      }

      .app-boot-submark {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.04em;
        opacity: 0.6;
        margin-top: -12px;
      }

      .app-boot-progress {
        width: min(200px, 50vw);
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.2);
      }

      .app-boot-bar {
        height: 100%;
        width: 32%;
        border-radius: inherit;
        background: linear-gradient(90deg, #0071e3 0%, #00c6ff 100%);
      }

      .app-boot-progress[data-mode="indeterminate"] .app-boot-bar {
        animation: app-boot-sweep 1.25s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes app-boot-sweep {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(340%); }
      }

      @keyframes app-boot-pulse {
        0%, 100% { transform: scale(1); filter: brightness(1); }
        50% { transform: scale(1.02); filter: brightness(1.08); }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-logo { animation: none; }
        .app-boot-progress[data-mode="indeterminate"] .app-boot-bar {
          width: 50%;
          animation: none;
        }
        #app-boot-splash { transition: none; }
      }
    </style>
  </head>

  <body>
    <div id="app-boot-splash" aria-hidden="true">
      <img src="/app-icon.png" alt="AI CodePass" class="app-boot-logo" />
      <div class="app-boot-mark">AI CodePass</div>
      <div class="app-boot-submark">All-in-One AI Coding Assistant Manager</div>
      <div class="app-boot-progress" data-mode="indeterminate">
        <div class="app-boot-bar" id="app-boot-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      window.setTimeout(function () {
        var splash = document.getElementById("app-boot-splash");
        if (splash) {
          splash.classList.add("is-hidden");
        }
      }, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
